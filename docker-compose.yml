# docker-compose.yml — nhánh backend của WebsiteQuanAo
version: '3.8'
name: quan-ao

services:
  mysql:
    image: mysql:8.0
    container_name: quan-ao-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: databasequanao
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - quan-ao-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: quan-ao-redis
    networks:
      - quan-ao-net
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: quan-ao-rabbitmq
    networks:
      - quan-ao-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: quan-ao-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - quan-ao-net
    restart: unless-stopped

  backend:
    image: ghcr.io/truong-backend/websitequanao-backend:latest
    container_name: quan-ao-backend
    env_file:
      - /opt/quan-ao/.env
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - quan-ao-net
    restart: unless-stopped

  frontend:
    image: ghcr.io/truong-backend/websitequanao-frontend:latest
    container_name: quan-ao-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quan-ao-net
    restart: unless-stopped

networks:
  quan-ao-net:
    driver: bridge

volumes:
  mysql_data:
  minio_data: