version: "3.8"
name: quan-ao

services:
  mysql:
    image: mysql:8.0
    container_name: qa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: StrongPass@2024
      MYSQL_DATABASE: fashiondb
    volumes:
      - mysql_qa_data:/var/lib/mysql
    networks: [qa-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis-qa:
    image: redis:7.2-alpine
    container_name: qa-redis
    volumes: [redis_qa_data:/data]
    networks: [qa-net]
    restart: unless-stopped

  rabbitmq-qa:
    image: rabbitmq:3.13-management-alpine
    container_name: qa-rabbitmq
    volumes: [rabbitmq_qa_data:/var/lib/rabbitmq]
    networks: [qa-net]
    restart: unless-stopped

  minio-qa:
    image: minio/minio:latest
    container_name: qa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes: [minio_qa_data:/data]
    ports:
      - "9000:9000"
    networks: [qa-net]
    restart: unless-stopped

  backend:
    image: ghcr.io/truong-backend/websitequanao-backend:latest
    container_name: qa-backend
    env_file: [/opt/quan-ao/.env]
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis-qa:
        condition: service_started
      rabbitmq-qa:
        condition: service_started
    networks: [qa-net]
    restart: unless-stopped

  frontend:
    image: ghcr.io/truong-backend/websitequanao-frontend:latest
    container_name: qa-frontend
    ports:
      - "8090:80"
    depends_on: [backend]
    networks: [qa-net]
    restart: unless-stopped

networks:
  qa-net:
    driver: bridge

volumes:
  mysql_qa_data:
  redis_qa_data:
  rabbitmq_qa_data:
  minio_qa_data: