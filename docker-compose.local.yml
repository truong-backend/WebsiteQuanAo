version: "3.8"
name: quan-ao

# ============================================================
#  docker-compose.local.yml — Chạy LOCAL (Windows/Mac/Linux)
#  Dùng: docker compose -f docker-compose.local.yml up -d mysql redis-qa rabbitmq-qa minio-qa
# ============================================================

services:

  # ── MySQL ──────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: qa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: StrongPass@2024
      MYSQL_DATABASE: fashiondb
    ports:
      - "3306:3306"
    volumes:
      - mysql_qa_data:/var/lib/mysql
    networks: [qa-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Redis (tên giống production: redis-qa) ─────────────────
  redis-qa:
    image: redis:7.2-alpine
    container_name: qa-redis
    ports:
      - "6379:6379"
    volumes: [redis_qa_data:/data]
    networks: [qa-net]
    restart: unless-stopped

  # ── RabbitMQ (tên giống production: rabbitmq-qa) ───────────
  rabbitmq-qa:
    image: rabbitmq:3.13-management-alpine
    container_name: qa-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes: [rabbitmq_qa_data:/var/lib/rabbitmq]
    networks: [qa-net]
    restart: unless-stopped

  # ── MinIO (tên giống production: minio-qa) ─────────────────
  minio-qa:
    image: minio/minio:latest
    container_name: qa-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [minio_qa_data:/data]
    networks: [qa-net]
    restart: unless-stopped

networks:
  qa-net:
    driver: bridge

volumes:
  mysql_qa_data:
  redis_qa_data:
  rabbitmq_qa_data:
  minio_qa_data: